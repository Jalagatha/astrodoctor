[program:astrodoctor]
directory=/projects/astrodoctor
command=/projects/astrodoctor/.venv/bin/python -m gunicorn --workers 1 --threads 2 --timeout 180 --bind 127.0.0.1:8003 config.wsgi:application
user=astrodoctor
environment=HOME="/projects/astrodoctor",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",PYTHONUNBUFFERED="1"
umask=0077
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=190
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/astrodoctor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
